<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Lab</title>
<!-- One page, one waveform. The switch at the top tags the take Voice or SFX. Record or import (or open the library),
     crop, convert if it is a voice, add effects that run live on playback, render, export. Every step lands in the same
     waveform; undo walks back through take, conversion, render. Originals and augmented clips save themselves. -->
<link rel="stylesheet" href="lab.css">
<script src="https://cdn.jsdelivr.net/npm/lucide@latest/dist/umd/lucide.min.js"></script>
</head>
<body>

<main class="mx-auto max-w-3xl px-6 py-10">
  <section class="card">

    <div class="grid gap-3 px-6 pt-6 pb-5">
      <div id="voice-row" class="flex items-center gap-3">
        <span class="label w-24">Voice</span>
        <select id="voice" class="select flex-1"></select>
        <button id="play-voice" class="btn-icon" title="Play" aria-label="Play the voice"><i data-lucide="play"></i></button>
        <button id="btn-voice-new" class="btn-icon" title="New voice" aria-label="New voice"><i data-lucide="plus"></i></button>
      </div>
      <div class="flex items-center gap-3">
        <span class="label w-24">Name</span>
        <input id="name" class="input flex-1" placeholder="optional" autocomplete="off">
      </div>
    </div>

    <div id="editor" class="rule px-6 pt-5 pb-5"></div>

    <div id="convert" class="rule grid gap-4 px-6 py-5">
      <div class="flex items-center gap-3">
        <span class="label w-24">Mode</span>
        <div id="mode" class="seg">
          <button data-value="v1" class="active" title="Your delivery in the voice's timbre, moved to its pitch"><i data-lucide="user-round"></i>Timbre</button>
          <button data-value="v2" title="The voice's accent and emotion as well; slower"><i data-lucide="sparkles"></i>Emotion</button>
        </div>
        <button id="btn-go" class="btn-icon btn-accent ml-auto" title="Convert" aria-label="Convert" disabled><i data-lucide="wand-2"></i></button>
      </div>
      <div class="flex items-center gap-3">
        <span class="label w-24">Quality</span>
        <input id="steps" type="range" min="4" max="40" value="15" class="flex-1">
        <span id="steps-v" class="mono w-16 text-right text-xs text-slate-400">15</span>
      </div>
      <div id="pitch-row" class="flex items-center gap-3">
        <span class="label w-24">Pitch</span>
        <input id="pitch" type="range" min="-6" max="12" value="0" class="flex-1">
        <span id="pitch-v" class="mono w-16 text-right text-xs text-slate-400">+0 st</span>
      </div>
      <div id="progress-row" class="flex items-center gap-3" hidden>
        <span class="label w-24"></span>
        <div class="bar flex-1"><div id="fill" class="fill" style="width:0%"></div></div>
        <span id="progress-text" class="mono w-16 text-right text-xs muted"></span>
      </div>
    </div>

    <div class="rule px-6 py-5">
      <div class="flex items-center gap-3">
        <span class="label w-24">Effects</span>
        <span id="chain-empty" class="text-sm muted">Live while it plays</span>
        <button id="btn-add" class="btn-icon ml-auto" title="Add an effect" aria-label="Add an effect"><i data-lucide="plus"></i></button>
      </div>
      <div id="chain" class="mt-3 grid gap-2"></div>
    </div>

    <div class="rule flex items-center gap-2 px-6 py-5">
      <button id="btn-render" class="btn-icon btn-accent" title="Render the effects" aria-label="Render the effects" disabled><i data-lucide="save"></i></button>
      <span id="est" class="mono ml-1 text-xs muted"></span>
      <span class="ml-auto flex gap-2">
        <button id="btn-undo" class="btn-icon" title="Undo" aria-label="Undo" disabled><i data-lucide="undo-2"></i></button>
        <button id="btn-game" class="btn-icon" title="Export for the game (Opus)" aria-label="Export for the game" disabled><i data-lucide="gamepad-2"></i></button>
        <button id="btn-share" class="btn-icon" title="Share (MP3)" aria-label="Share" disabled><i data-lucide="share-2"></i></button>
      </span>
    </div>
  </section>
  <p id="toast" class="mt-4 h-5 text-sm text-slate-400"></p>
</main>

<script type="module" src="app.js"></script>
</body>
</html>
